<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo → WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --cardboard: #D9CBA9;
    --cardboard-dark: #C4B48C;
    --ink: #2B2A26;
    --ink-soft: #5C574C;
    --tag-red: #E8432F;
    --paper: #F4EFE2;
    --whatsapp: #25D366;
    --whatsapp-dark: #1DA851;
    --line: rgba(43,42,38,0.18);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, rgba(43,42,38,0.035) 0px, rgba(43,42,38,0.035) 1px, transparent 1px, transparent 3px);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:120px;
  }
  header{
    background:var(--ink);
    color:var(--paper);
    padding:28px 20px 22px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:180px; height:180px;
    border:2px dashed rgba(244,239,226,0.25);
    border-radius:50%;
  }
  h1{
    font-family:'Oswald',sans-serif;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-size:clamp(22px,4vw,32px);
    margin:0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  h1 .tagdot{
    width:10px;height:10px;border-radius:50%;
    background:var(--tag-red);
    display:inline-block;
  }
  header p{
    margin:6px 0 0;
    color:rgba(244,239,226,0.7);
    font-size:14px;
    max-width:560px;
  }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 20px; }
  .controls{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin:20px 0 6px;
    position:relative;
  }
  .controls select, .controls input[type=text]{
    font-family:'Inter',sans-serif;
    font-size:14px;
    padding:9px 12px;
    border:1.5px solid var(--ink);
    border-radius:6px;
    background:var(--paper);
    color:var(--ink);
  }
  .controls .pill{
    font-size:12px;
    color:var(--ink-soft);
    padding:6px 10px;
    border:1px solid var(--line);
    border-radius:20px;
    background:rgba(255,255,255,0.4);
  }
  button{
    font-family:'Inter',sans-serif;
    cursor:pointer;
    border:none;
  }
  .btn-ghost{
    background:transparent;
    border:1.5px solid var(--ink);
    color:var(--ink);
    padding:8px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
  }
  .btn-ghost:hover{ background:var(--ink); color:var(--paper); }
  .status-line{
    font-size:12px; color:var(--ink-soft); margin:8px 0 18px;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:18px;
    margin-top:10px;
  }
  .card{
    background:var(--cardboard);
    border-radius:4px;
    position:relative;
    padding:14px 14px 16px;
    box-shadow:0 2px 0 var(--cardboard-dark), 0 6px 14px rgba(43,42,38,0.12);
    transition:transform .15s ease;
  }
  .card.selected{
    outline:2.5px solid var(--tag-red);
    outline-offset:2px;
  }
  .card::before{
    /* punched hole like a price tag */
    content:"";
    position:absolute;
    top:10px; left:10px;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--paper);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
  }
  .card-check{
    position:absolute; top:10px; right:10px;
    width:20px; height:20px;
    accent-color:var(--tag-red);
    cursor:pointer;
  }
  .imgbox{
    width:100%; aspect-ratio:1/1;
    background:#fff;
    border-radius:3px;
    overflow:hidden;
    margin-top:14px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(43,42,38,0.15);
  }
  .imgbox img{ width:100%; height:100%; object-fit:cover; display:block; }
  .imgbox .fallback{
    font-size:12px; color:var(--ink-soft); text-align:center; padding:10px;
  }
  .imgbox .fallback a{ color:var(--tag-red); font-weight:600; }
  .sizes{
    display:flex; gap:6px; margin-top:10px;
  }
  .sizes span{
    font-family:'Oswald',sans-serif;
    background:var(--ink); color:var(--paper);
    font-size:12px; padding:3px 8px; border-radius:3px;
    letter-spacing:0.02em;
  }
  .prices{ margin-top:10px; font-size:13px; line-height:1.5; }
  .prices .venta{ font-weight:700; font-size:16px; }
  .prices .est{ color:var(--ink-soft); text-decoration: line-through; font-size:12px; }
  .card-actions{ margin-top:12px; display:flex; gap:8px; }
  .send-one{
    flex:1;
    background:var(--whatsapp);
    color:#fff;
    font-weight:700;
    font-size:13px;
    padding:9px 8px;
    border-radius:6px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .send-one:hover{ background:var(--whatsapp-dark); }
  .empty, .error{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .error{ color:var(--tag-red); font-weight:600; }

  /* floating bar */
  #floatbar{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--ink); color:var(--paper);
    padding:14px 20px;
    display:none;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    box-shadow:0 -6px 20px rgba(0,0,0,0.25);
    z-index:50;
  }
  #floatbar.show{ display:flex; }
  #floatbar .count{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    white-space:nowrap;
  }
  #floatbar .count b{ color:var(--tag-red); }
  #floatbar textarea{
    flex:1;
    min-width:200px;
    resize:vertical;
    min-height:38px;
    max-height:120px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:8px 10px;
    border-radius:6px;
    border:none;
  }
  #floatbar .send-all{
    background:var(--whatsapp);
    color:#fff; font-weight:700; font-size:14px;
    padding:11px 18px; border-radius:6px;
    display:flex; align-items:center; gap:8px;
    white-space:nowrap;
  }
  #floatbar .send-all:hover{ background:var(--whatsapp-dark); }
  #floatbar .clear{
    background:none; color:var(--paper); text-decoration:underline;
    font-size:12px; opacity:0.7;
  }
  .wa-icon{ width:16px; height:16px; fill:#fff; flex-shrink:0; }
  @media (max-width:640px){
    #floatbar{ flex-direction:column; align-items:stretch; }
    #floatbar .send-all{ justify-content:center; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1><span class="tagdot"></span>Catálogo → WhatsApp</h1>
    <p>Selecciona lo que quieras enviar a un comprador y arma el mensaje de WhatsApp con foto y precio en un clic.</p>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <select id="filterSize">
      <option value="">Talla US: todas</option>
    </select>
    <select id="sortBy">
      <option value="recent">Más recientes primero</option>
      <option value="priceAsc">Precio: menor a mayor</option>
      <option value="priceDesc">Precio: mayor a menor</option>
    </select>
    <button class="btn-ghost" id="reloadBtn">↻ Actualizar catálogo</button>
    <span class="pill" id="countPill">Cargando…</span>
  </div>
  <div class="status-line" id="statusLine"></div>

  <div id="grid"><div class="empty">Cargando catálogo…</div></div>
</div>

<div id="floatbar">
  <div class="count"><b id="selCount">0</b> seleccionado(s)</div>
  <textarea id="templateBox"></textarea>
  <button class="clear" id="clearSel">Quitar selección</button>
  <button class="send-all" id="sendAll">
    <svg class="wa-icon" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.198.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-1.746-.873-2.889-1.556-4.038-3.528-.305-.526.305-.489.873-1.627.099-.198.05-.371-.05-.52-.099-.148-.669-1.611-.916-2.206-.242-.579-.487-.5-.669-.51-.173-.008-.372-.01-.571-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.05 3.126 4.966 4.259 2.916 1.132 2.916.755 3.436.708.52-.05 1.758-.719 2.006-1.413.248-.694.248-1.29.173-1.413-.074-.124-.271-.198-.57-.347z"/><path d="M12.05 2C6.55 2 2.1 6.45 2.1 11.95c0 1.9.52 3.68 1.42 5.2L2 22l5.03-1.48a9.9 9.9 0 0 0 5.02 1.36h.004c5.5 0 9.95-4.45 9.95-9.95C22 6.45 17.55 2 12.05 2zm0 18.13a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.19.94.85-3.11-.2-.32a8.16 8.16 0 0 1-1.25-4.37c0-4.52 3.68-8.19 8.2-8.19 2.19 0 4.25.86 5.8 2.41a8.15 8.15 0 0 1 2.4 5.79c0 4.52-3.68 8.17-8.13 8.17z"/></svg>
    Enviar por WhatsApp
  </button>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS7e_IekI9tZJaDGPWd8xw1wFUOpFSiQZOk-AWZwfPTmrG-PgVbXFaSxujXln8PAQqx275piuJaLLCm/pub?gid=1069283032&single=true&output=csv";

let ITEMS = [];
let SELECTED = new Set();

const grid = document.getElementById('grid');
const statusLine = document.getElementById('statusLine');
const countPill = document.getElementById('countPill');
const filterSize = document.getElementById('filterSize');
const sortBy = document.getElementById('sortBy');
const templateBox = document.getElementById('templateBox');

function money(v){
  const n = parseFloat(String(v).replace(/[^0-9.]/g,''));
  return isNaN(n) ? null : n;
}

function driveImageUrl(rawUrl, driveOpenLink){
  // Prefer the direct-view URL (column J), fall back to building one from the open link
  if(rawUrl && rawUrl.includes('drive.google.com')){
    return rawUrl.trim();
  }
  const m = (driveOpenLink||'').match(/id=([a-zA-Z0-9_-]+)/);
  if(m) return `https://drive.google.com/uc?export=view&id=${m[1]}`;
  return null;
}

function parseCSV(text){
  const result = Papa.parse(text.trim(), {skipEmptyLines:true});
  const rows = result.data;
  const items = [];
  for(let i=1;i<rows.length;i++){ // skip header row
    const r = rows[i];
    if(!r || r.length < 8) continue;
    const [timestamp, imagenOpen, sizeUS, sizeCM, fechaCompra, precioCompra, precioEstimado, precioFinal, , urlModificada] = r;
    const img = driveImageUrl(urlModificada, imagenOpen);
    if(!sizeUS && !img) continue;
    items.push({
      id: i,
      timestamp,
      sizeUS: (sizeUS||'').trim(),
      sizeCM: (sizeCM||'').trim(),
      fechaCompra: (fechaCompra||'').trim(),
      precioCompra: money(precioCompra),
      precioEstimado: money(precioEstimado),
      precioFinal: money(precioFinal),
      imgUrl: img,
      openLink: (imagenOpen||'').trim()
    });
  }
  return items.reverse(); // most recent first by default
}

function populateSizeFilter(){
  const sizes = [...new Set(ITEMS.map(i=>i.sizeUS).filter(Boolean))]
    .sort((a,b)=>parseFloat(a)-parseFloat(b));
  filterSize.innerHTML = '<option value="">Talla US: todas</option>' +
    sizes.map(s=>`<option value="${s}">Talla US ${s}</option>`).join('');
}

function currentList(){
  let list = [...ITEMS];
  if(filterSize.value) list = list.filter(i=>i.sizeUS === filterSize.value);
  if(sortBy.value === 'priceAsc') list.sort((a,b)=>(a.precioFinal??1e9)-(b.precioFinal??1e9));
  if(sortBy.value === 'priceDesc') list.sort((a,b)=>(b.precioFinal??-1)-(a.precioFinal??-1));
  return list;
}

function messageForItem(item){
  const price = item.precioFinal ?? item.precioEstimado;
  const priceStr = price != null ? `$${price}` : 'Precio a consultar';
  let msg = `👟 Tenis talla ${item.sizeUS||'?'} US (${item.sizeCM||'?'} cm)\n💰 Precio: ${priceStr}\n`;
  if(item.imgUrl) msg += `📸 Foto: ${item.imgUrl}\n`;
  msg += `\n¿Te interesa? Escríbeme 😊`;
  return msg;
}

function waLink(text){
  return `https://wa.me/?text=${encodeURIComponent(text)}`;
}

function render(){
  const list = currentList();
  countPill.textContent = `${list.length} artículo(s)`;
  if(list.length === 0){
    grid.innerHTML = '<div class="empty">No hay artículos con ese filtro.</div>';
    return;
  }
  grid.innerHTML = list.map(item => {
    const price = item.precioFinal ?? item.precioEstimado;
    const showEst = item.precioEstimado != null && item.precioFinal != null && item.precioEstimado !== item.precioFinal;
    const isSel = SELECTED.has(item.id);
    return `
    <div class="card ${isSel?'selected':''}" data-id="${item.id}">
      <input type="checkbox" class="card-check" data-id="${item.id}" ${isSel?'checked':''}>
      <div class="imgbox">
        ${item.imgUrl
          ? `<img src="${item.imgUrl}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'fallback\\'>No se pudo cargar la foto.<br><a href=\\'${item.openLink}\\' target=\\'_blank\\'>Ver en Drive ↗</a></div>'">`
          : `<div class="fallback">Sin foto disponible</div>`}
      </div>
      <div class="sizes">
        ${item.sizeUS?`<span>US ${item.sizeUS}</span>`:''}
        ${item.sizeCM?`<span>${item.sizeCM} cm</span>`:''}
      </div>
      <div class="prices">
        <div class="venta">${price!=null?`$${price}`:'Precio a consultar'}</div>
        ${showEst?`<div class="est">$${item.precioEstimado}</div>`:''}
      </div>
      <div class="card-actions">
        <a class="send-one" target="_blank" href="${waLink(messageForItem(item))}">
          <svg class="wa-icon" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.198.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-1.746-.873-2.889-1.556-4.038-3.528-.305-.526.305-.489.873-1.627.099-.198.05-.371-.05-.52-.099-.148-.669-1.611-.916-2.206-.242-.579-.487-.5-.669-.51-.173-.008-.372-.01-.571-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.05 3.126 4.966 4.259 2.916 1.132 2.916.755 3.436.708.52-.05 1.758-.719 2.006-1.413.248-.694.248-1.29.173-1.413-.074-.124-.271-.198-.57-.347z"/><path d="M12.05 2C6.55 2 2.1 6.45 2.1 11.95c0 1.9.52 3.68 1.42 5.2L2 22l5.03-1.48a9.9 9.9 0 0 0 5.02 1.36h.004c5.5 0 9.95-4.45 9.95-9.95C22 6.45 17.55 2 12.05 2zm0 18.13a8.2 8.2 0 0 1-4.18-1.14l-.3-.18-3.19.94.85-3.11-.2-.32a8.16 8.16 0 0 1-1.25-4.37c0-4.52 3.68-8.19 8.2-8.19 2.19 0 4.25.86 5.8 2.41a8.15 8.15 0 0 1 2.4 5.79c0 4.52-3.68 8.17-8.13 8.17z"/></svg>
          Enviar
        </a>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.card-check').forEach(cb=>{
    cb.addEventListener('change', e=>{
      const id = parseInt(e.target.dataset.id);
      if(e.target.checked) SELECTED.add(id); else SELECTED.delete(id);
      updateFloatbar();
      render();
    });
  });
}

function updateFloatbar(){
  const bar = document.getElementById('floatbar');
  const selCount = document.getElementById('selCount');
  selCount.textContent = SELECTED.size;
  if(SELECTED.size > 0){
    bar.classList.add('show');
    const selectedItems = ITEMS.filter(i=>SELECTED.has(i.id));
    templateBox.value = selectedItems.map(messageForItem).join('\n\n———\n\n');
  } else {
    bar.classList.remove('show');
  }
}

document.getElementById('clearSel').addEventListener('click', ()=>{
  SELECTED.clear();
  updateFloatbar();
  render();
});

document.getElementById('sendAll').addEventListener('click', ()=>{
  window.open(waLink(templateBox.value), '_blank');
});

filterSize.addEventListener('change', render);
sortBy.addEventListener('change', render);

function loadData(){
  statusLine.textContent = 'Cargando catálogo desde Google Sheets…';
  grid.innerHTML = '<div class="empty">Cargando catálogo…</div>';
  fetch(CSV_URL, {cache:'no-store'})
    .then(r=>{
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(text=>{
      ITEMS = parseCSV(text);
      populateSizeFilter();
      statusLine.textContent = `Actualizado: ${new Date().toLocaleString()} · ${ITEMS.length} artículo(s) en total`;
      render();
    })
    .catch(err=>{
      grid.innerHTML = `<div class="error">
        No se pudo cargar el catálogo automáticamente (${err.message}).<br><br>
        Esto puede pasar si la hoja no permite lectura desde fuera del navegador.<br>
        Verifica que el enlace siga publicado en Archivo → Compartir → Publicar en la web,
        y usa el botón "Actualizar catálogo" para reintentar.
      </div>`;
      statusLine.textContent = '';
    });
}

document.getElementById('reloadBtn').addEventListener('click', loadData);

loadData();
</script>
</body>
</html>
